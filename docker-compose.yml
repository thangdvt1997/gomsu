services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gomsu-web:latest
    container_name: gomsu-web
    ports:
      - "${WEB_PORT:-8899}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Smoke tests against the running `web` service. Not started by a plain
  # `docker compose up`; run explicitly with:
  #   docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      - BASE_URL=http://web
    depends_on:
      web:
        condition: service_healthy
    profiles: ["test"]

  # --- New Next.js CMS/e-commerce stack (staging port, does not touch `web`
  # above). See d:\work-out\gomsu\web and the rollout plan in
  # C:\Users\thangdv\.claude\plans\keen-juggling-bubble.md. `web`/8899 keeps
  # serving production traffic until this stack passes parity testing and
  # the nginx proxy_pass target is deliberately cut over (deploy/cutover.sh).
  postgres:
    image: postgres:16-alpine
    container_name: gomsu-postgres
    environment:
      - POSTGRES_USER=gomsu
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_DB=gomsu
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomsu"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: gomsu-app:latest
    container_name: gomsu-app
    env_file:
      - ./web/.env
    environment:
      - DATABASE_URL=postgresql://gomsu:${DB_PASSWORD:-changeme}@postgres:5432/gomsu
      - MEDIA_DIR=/app/media-data
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - media_data:/app/media-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-off Prisma CLI access (migrate deploy, ad-hoc scripts) against the
  # live `app` database, using the `builder` stage which still has the full
  # devDependencies (the `app` runtime image strips the Prisma CLI down to
  # just the generated client to keep the image small). Not started by a
  # plain `docker compose up`; run explicitly with e.g.:
  #   docker compose --profile tools run --rm migrate npx prisma migrate deploy
  migrate:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: builder
    image: gomsu-app-builder:latest
    environment:
      - DATABASE_URL=postgresql://gomsu:${DB_PASSWORD:-changeme}@postgres:5432/gomsu
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  # Playwright parity/CMS/payment suite against the new stack. Not started
  # by a plain `docker compose up`; run explicitly with:
  #   docker compose --profile test run --rm e2e
  e2e:
    build:
      context: ./web
      dockerfile: tests/e2e/Dockerfile
    environment:
      - BASE_URL=http://app:3000
      - ADMIN_TEST_EMAIL=${ADMIN_TEST_EMAIL:-}
      - ADMIN_TEST_PASSWORD=${ADMIN_TEST_PASSWORD:-}
    depends_on:
      app:
        condition: service_healthy
    profiles: ["test"]

volumes:
  pgdata:
  media_data:
