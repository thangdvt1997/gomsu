server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Allow clean URLs (e.g. /san-pham -> /san-pham.html) while every
    # internal link in the generated site already uses the .html form.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
